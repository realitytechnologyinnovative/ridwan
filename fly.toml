app = "ridwan"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DJANGO_ENV = "production"
  SQLITE_DB_PATH = "/data/db.sqlite3"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpus = 1

[[statics]]
  guest_path = "/code/static"
  url_prefix = "/static/"


[experimental]
  auto_scale = false


[deploy]
  strategy = "rolling"
